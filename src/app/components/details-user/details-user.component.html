<div class="back-link">
    <a [routerLink]="['/users']" class="btn-back">
        <span>← Retour à la liste des utilisateurs</span>
    </a>
</div>

<div class="user-details">
    <div class="user-header">
        <div class="user-avatar">
            <span>{{ user?.nom?.charAt(0) }}{{ user?.prenom?.charAt(0) }}</span>
        </div>
        <h2>{{ user?.nom }} {{ user?.prenom }}</h2>
    </div>
    
    <div class="user-info" *ngIf="!isEditing">
        <p><strong>Email:</strong> {{ user?.email }}</p>
    </div>

    <form *ngIf="isEditing && user" (ngSubmit)="saveUser()" #userForm="ngForm" class="edit-form" novalidate>
        <div class="mb-3">
            <label for="nom" class="form-label">Nom</label>
            <input 
                type="text" 
                class="form-control" 
                id="nom" 
                name="nom"
                [(ngModel)]="user!.nom"
                required>
        </div>

        <div class="mb-3">
            <label for="prenom" class="form-label">Prénom</label>
            <input 
                type="text" 
                class="form-control" 
                id="prenom" 
                name="prenom"
                [(ngModel)]="user!.prenom"
                required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input 
                type="email" 
                class="form-control" 
                id="email" 
                name="email"
                [(ngModel)]="user!.email"
                required>
        </div>

        <div class="d-flex gap-2">
            <button 
                type="submit" 
                class="btn btn-primary"
                [disabled]="!userForm.valid">
                Enregistrer
            </button>
            <button 
                type="button" 
                class="btn btn-secondary"
                (click)="cancelEdit()">
                Annuler
            </button>
        </div>
    </form>
    
    <div class="user-actions" *ngIf="!isEditing">
        <button class="btn-edit" (click)="editUser()">Modifier</button>
        <button class="btn-delete" (click)="deleteUser()">Supprimer</button>
    </div>
</div>
