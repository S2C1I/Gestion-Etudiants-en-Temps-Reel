<nav>
    <ul>
        <li><a routerLink="/dashboard">Dashboard</a></li>

        <li><a routerLink="/etudiant">Etudiants</a></li>
        <li><a routerLink="/users">Users</a></li>
        <li><a routerLink="/chat" class="chat-link">
            Chat
            <span class="nav-badge" *ngIf="totalUnread > 0">{{ totalUnread }}</span>
        </a></li>

        <!-- show Login when not authenticated -->
        <li *ngIf="!isLoggedIn"><a routerLink="/">Login</a></li>

        <!-- Show user info and logout when authenticated -->
        <li *ngIf="isLoggedIn" class="user-menu">
            <div class="user-info-container">
                <div class="user-avatar" [class.online]="isOnline">
                    {{ currentUser?.prenom?.charAt(0) || 'U' }}{{ currentUser?.nom?.charAt(0) || '' }}
                </div>
                <div class="user-details">
                    <span class="user-name">{{ currentUser?.prenom }} {{ currentUser?.nom }}</span>
                    <span class="connection-status" [class.online]="isOnline">
                        {{ isOnline ? 'En ligne' : 'Hors ligne' }}
                    </span>
                </div>
            </div>
            <button class="logout-btn" (click)="logout()" type="button">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </li>

    </ul>
</nav>
