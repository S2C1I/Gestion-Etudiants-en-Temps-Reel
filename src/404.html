<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Front Express</title>
  <script>
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // Store the path and redirect to index.html with the path as a query string
    sessionStorage.setItem('path', location.pathname.substring(0, location.pathname.lastIndexOf('/')) + location.search);
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, -1).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(2).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
